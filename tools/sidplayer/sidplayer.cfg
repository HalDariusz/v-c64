# tools/sidplayer/sidplayer.cfg - ld65 linker configuration: a single flat
# image starting exactly at $8000 (the start of the cartridge LOROM
# window), size limited to 8 KB (LOROM). With this configuration, ld65
# directly produces a raw binary file (no ELF) - byte 0 of the output
# file corresponds to physical address $8000.
#
# Part of v-c64 - a bare-metal Commodore 64 unikernel running directly
# on Linux /dev/kvm, with no QEMU involved.
#
# Author: Dariusz Nowak <hal.dariusz.nowak@gmail.com>

MEMORY {
    RAM: start = $8000, size = $2000, type = rw, file = %O;
}
SEGMENTS {
    CODE: load = RAM, type = rw;
}
