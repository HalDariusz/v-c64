# Konfiguracja ld65: pojedynczy plaski obraz zaczynajacy sie dokladnie pod
# $8000 (poczatek okna kartridza LOROM), rozmiar ograniczony do 8 KB (LOROM).
# ld65 z ta konfiguracja od razu produkuje surowy plik binarny (bez ELF) -
# bajt 0 pliku wyjsciowego odpowiada fizycznemu adresowi $8000.

MEMORY {
    RAM: start = $8000, size = $2000, type = rw, file = %O;
}
SEGMENTS {
    CODE: load = RAM, type = rw;
}
